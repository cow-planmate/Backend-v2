name: Build & Push (Docker Hub)

# main 에 push 되면 이미지를 빌드해 Docker Hub 로 push.
# 서버(docker53)의 Watchtower 가 새 이미지를 감지해 자동 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/cycle123/planmate-backend-v2
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 이 저장소의 @SpringBootTest 는 Testcontainers 를 쓰지 않고 localhost 의 Postgres/Redis 에
    # 붙는다(application.yml 기본값). 러너에 그 둘을 띄워 로컬 개발 환경과 같은 모양을 만든다.
    # 값은 application.yml 의 기본값과 일치해야 한다 — 다르면 테스트가 붙을 곳을 잃는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planmate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dockerfile 은 bootJar -x test 로 빌드하므로 테스트가 여기서만 돈다.
      # 이 단계가 없으면 컴파일만 되는 이미지가 latest 로 올라가고, Watchtower 가 그걸
      # 그대로 운영에 밀어 넣는다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Test
        run: chmod +x gradlew && ./gradlew --no-daemon test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 이미지 태그를 매니페스트 레포에 커밋한다. ArgoCD 가 그걸 보고 배포한다.
      #
      # Watchtower(:latest) 경로는 그대로 둔다 — 컷오버 전까지 구 환경(planmatetest)이
      # 계속 자동 갱신돼야 하기 때문이다. 컷오버 후 :latest push 와 함께 걷어낸다.
      #
      # 태그 형식은 위 metadata-action 의 type=sha,format=short 와 같아야 한다(sha-7자리).
      # 어긋나면 존재하지 않는 태그를 커밋하고 파드가 ImagePullBackOff 로 멈춘다.
      - name: Bump image tag in deploy repo
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          SERVICE: planmate-backend-v2
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"

          # 키는 러너 안에서만 산다. 600 이 아니면 ssh 가 거부한다.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:cow-planmate/deploy.git /tmp/deploy
          cd /tmp/deploy

          # sed 로 한 줄만 바꾼다. 파이썬 히어독을 쓰지 않는 이유: YAML 블록 스칼라 안에서는
          # 본문이 들여쓰기되는데, bash 는 들여쓴 히어독 종료자를 인식하지 못하고(<<- 는 탭만
          # 벗긴다) 파이썬도 첫 줄에서 IndentationError 로 죽는다. 즉 반드시 실패한다.
          #
          # "name: cycle123/<서비스>" 바로 다음 줄(n)의 newTag 만 바꾼다.
          before=$(grep -c "name: cycle123/${SERVICE}$" kustomization.yaml)
          [ "$before" = "1" ] || { echo "kustomization.yaml 에서 ${SERVICE} 를 정확히 1개 찾지 못했다 (${before}개)"; exit 1; }
          sed -i "\|name: cycle123/${SERVICE}\$|{n;s|newTag: .*|newTag: ${TAG}|}" kustomization.yaml

          if git diff --quiet; then
            echo "태그가 이미 ${TAG} 다 — 커밋할 것이 없다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${SERVICE}): ${TAG}"
          # 4개 레포가 동시에 머지되면 push 가 부딪힌다. 한 번 rebase 하고 다시 민다.
          git push || { git pull --rebase && git push; }
