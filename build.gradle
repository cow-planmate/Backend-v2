plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.planmate'
version = '0.0.1-SNAPSHOT'
def sharedSyncVersion = '5b3245b214'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // SharedSync Framework (WebSocket 실시간 협업편집)
    if (project.hasProperty('useLocalSharedSync') && project.useLocalSharedSync == 'true') {
        implementation 'com.sharedsync:sharedsync-starter:1.1.26'
        annotationProcessor 'com.sharedsync:sharedsync-autoconfigure:1.1.26'
    } else {
        implementation "com.github.Shared-Sync.SharedSync:sharedsync-starter:$sharedSyncVersion"
        annotationProcessor "com.github.Shared-Sync.SharedSync:sharedsync-autoconfigure:$sharedSyncVersion"
    }

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA + PostgreSQL + Flyway
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Firebase Admin (FCM)
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // UUID v7
    implementation 'com.github.f4b6a3:uuid-creator:6.0.0'

    // JSON
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // MinIO (프로필 이미지 저장)
    implementation 'io.minio:minio:8.5.12'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // JDK 17+ self-attach 제한 때문에 Mockito 5 inline mock maker(byte-buddy-agent) 초기화가
    // 실패하는 걸 막기 위한 플래그(IDE는 자동으로 붙여주지만 Gradle CLI는 명시가 필요)
    jvmArgs += ['-Djdk.attach.allowAttachSelf=true']
}

/**
 * 로컬 개발용 .env(gitignore 대상)를 KEY=VALUE로 읽는다.
 * `#` 주석 / 빈 줄 / 선택적 `export ` 접두사 / 값을 감싼 따옴표를 처리한다.
 */
def readDotEnv = { File envFile ->
    def result = [:]
    if (!envFile.exists()) {
        return result
    }
    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#')) {
            return
        }
        if (line.startsWith('export ')) {
            line = line.substring('export '.length()).trim()
        }
        def separator = line.indexOf('=')
        if (separator <= 0) {
            return
        }
        def key = line.substring(0, separator).trim()
        def value = line.substring(separator + 1).trim()
        if (value.length() >= 2
                && ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        result[key] = value
    }
    return result
}

bootRun {
    jvmArgs = ['-Xmx256m', '-Xms64m', '-XX:+UseSerialGC']

    // .env를 자동 주입한다 (`source .env` 불필요).
    // 쉘 환경변수보다 .env를 우선한다: Gradle 데몬은 자신을 처음 띄운 쉘의 환경을 계속
    // 들고 있어서, 쉘 우선으로 두면 오래된 값이 조용히 이기고 .env 수정이 안 먹는다.
    // 일회성 오버라이드가 필요하면 -Denv.KEY=VALUE 로 준다.
    readDotEnv(file('.env')).each { key, value ->
        environment(key, System.getProperty("env.$key") ?: value)
    }
}
