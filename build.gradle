plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.planmate'
version = '0.0.1-SNAPSHOT'
def sharedSyncVersion = '5db644c'
// buf.build/planmate/proto 의 모듈 커밋. **Backend-v2 / Community / Social / Notification
// 네 서비스가 반드시 같은 값이어야 한다.** 알림 이벤트 계약이 넷 모두에 걸쳐 있다.
def protoCommit = '20261016121932.25b4ebf280e6'
// BSR 생성 SDK 버전은 <생성 플러그인 버전>.1.<모듈 커밋> 형태라 아티팩트마다 접두사가 다르다.
// 값은 추측하지 말고 BSR 모듈의 Generated SDKs 탭에서 확인할 것.
def protobufSdkVersion = "35.1.0.1.$protoCommit"
def grpcSdkVersion = "1.83.1.1.$protoCommit"
def grpcStarterVersion = '3.1.0.RELEASE'
// 생성 SDK 가 요구하는 grpc-java 버전. net.devh 스타터는 grpc-core/netty-shaded 를 훨씬
// 낮은 버전으로 끌어오므로 섞이면 io.grpc 아티팩트 버전이 어긋난다 — BOM 으로 전부 정렬한다.
def grpcVersion = '1.83.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// wire 스키마 좌표(-Asharedsync.proto.package/file)는 더 이상 지정하지 않는다.
// SharedSync 가 엔티티 패키지(com.planmate.*)에서 planmate.sync.v1 로 유도한다 — 생성 결과는 동일하다.

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://jitpack.io' }
    // BSR Generated SDK (proto)
    maven { url 'https://buf.build/gen/maven' }
}


dependencies {
    // ── 서비스 간 gRPC 계약 (proto / BSR) ──
    implementation platform("io.grpc:grpc-bom:$grpcVersion")

    implementation "build.buf.gen:planmate_proto_protocolbuffers_java:$protobufSdkVersion"
    implementation "build.buf.gen:planmate_proto_grpc_java:$grpcSdkVersion"

    // gRPC 서버. spring-grpc 1.0+ 는 Spring Boot 4 를 요구하므로 Boot 3.5 인 이 프로젝트는
    // net.devh 스타터를 쓴다 (Boot 4 로 올릴 때 spring-grpc 로 갈아탈 것).
    implementation "net.devh:grpc-server-spring-boot-starter:$grpcStarterVersion"

    // SharedSync Framework (WebSocket 실시간 협업편집)
    if (project.hasProperty('useLocalSharedSync') && project.useLocalSharedSync == 'true') {
        implementation 'com.sharedsync:sharedsync-starter:1.1.26'
        annotationProcessor 'com.sharedsync:sharedsync-autoconfigure:1.1.26'
    } else {
        implementation "com.github.Shared-Sync.SharedSync:sharedsync-starter:$sharedSyncVersion"
        annotationProcessor "com.github.Shared-Sync.SharedSync:sharedsync-autoconfigure:$sharedSyncVersion"
    }

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA + PostgreSQL + Flyway
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Kafka notification outbox publisher
    implementation 'org.springframework.kafka:spring-kafka'

    // 분산 스케줄러 락. 인스턴스를 2개 이상 띄우면 @Scheduled 가 노드마다 돌아
    // 정리 잡이 중복 실행된다. 7.x 는 Boot 4 를 요구하므로 Boot 3.5 인 여기서는 6.x 를 쓴다.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.10.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.10.0'

    // Firebase Admin (FCM)
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // UUID v7
    implementation 'com.github.f4b6a3:uuid-creator:6.0.0'

    // JSON
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Prometheus 메트릭 노출 (management 전용 포트로 분리, SecurityConfig 영향 안 받음)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // MinIO (프로필 이미지 저장)
    implementation 'io.minio:minio:8.5.12'

    // Google Places 사진 WebP 변환 (06_키워드검색_API_인프라설계.md 4-2절)
    implementation 'com.sksamuel.scrimage:scrimage-core:4.1.3'
    implementation 'com.sksamuel.scrimage:scrimage-webp:4.1.3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // gRPC 서비스는 in-process 서버로 테스트한다 (실제 포트 바인딩 불필요)
    testImplementation 'io.grpc:grpc-inprocess'
    testImplementation 'io.grpc:grpc-testing'

    // 실제 PostgreSQL. outbox 시퀀스가 커밋 순서와 일치하는지는 두 트랜잭션을 실제로 겹쳐야만
    // 확인할 수 있다 — 목이나 H2 로는 nextval 시점과 가시성 시점의 차이가 재현되지 않는다.
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // "external" 태그(실제 Google API/MinIO 등 외부 인프라에 직접 붙는 테스트)는 CI에
    // 그 인프라가 없어서 뺀다 — 로컬에서 인프라 갖춰놓고 ./gradlew externalTest 로 따로 돌린다.
    useJUnitPlatform {
        excludeTags 'external'
    }

    // Testcontainers 가 Docker 데몬에 붙게 만드는 설정. docker-java 는 API 버전을 명시하지
    // 않으면 1.32 로 요청하는데 Docker 25+ 데몬은 최소 1.44 를 요구해 400 으로 거부한다.
    // 실제로 먹히는 건 systemProperty 'api.version' 이다 — 환경변수 DOCKER_API_VERSION 은
    // docker-java 의 설정 키에 매핑되지 않는다. DOCKER_HOST 는 환경변수 기반 전략이 먼저
    // 선택되게 해 설정 경로를 일정하게 만든다. (Gradle 테스트 워커는 쉘 환경을 그대로
    // 물려받지 않으므로 여기서 명시적으로 넘긴다.)
    environment 'DOCKER_HOST', System.getenv('DOCKER_HOST') ?: 'unix:///var/run/docker.sock'
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    // JDK 17+ self-attach 제한 때문에 Mockito 5 inline mock maker(byte-buddy-agent) 초기화가
    // 실패하는 걸 막기 위한 플래그(IDE는 자동으로 붙여주지만 Gradle CLI는 명시가 필요)
    jvmArgs += ['-Djdk.attach.allowAttachSelf=true']
}

tasks.register('externalTest', Test) {
    description = '실제 Google Places API/MinIO 등 외부 인프라에 붙는 "external" 태그 테스트만 돈다. ' +
            'CI에는 그 인프라가 없어 기본 test 태스크에서는 빠져 있다 — 로컬에 인프라(도커 MinIO, ' +
            'application-secret.yml의 실 API 키)를 갖춰놓고 수동으로 실행해서 검증할 때 쓴다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'external'
    }
    environment 'DOCKER_HOST', System.getenv('DOCKER_HOST') ?: 'unix:///var/run/docker.sock'
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    jvmArgs += ['-Djdk.attach.allowAttachSelf=true']
}

/**
 * 로컬 개발용 .env(gitignore 대상)를 KEY=VALUE로 읽는다.
 * `#` 주석 / 빈 줄 / 선택적 `export ` 접두사 / 값을 감싼 따옴표를 처리한다.
 */
def readDotEnv = { File envFile ->
    def result = [:]
    if (!envFile.exists()) {
        return result
    }
    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#')) {
            return
        }
        if (line.startsWith('export ')) {
            line = line.substring('export '.length()).trim()
        }
        def separator = line.indexOf('=')
        if (separator <= 0) {
            return
        }
        def key = line.substring(0, separator).trim()
        def value = line.substring(separator + 1).trim()
        if (value.length() >= 2
                && ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        result[key] = value
    }
    return result
}

bootRun {
    jvmArgs = ['-Xmx256m', '-Xms64m', '-XX:+UseSerialGC']

    // .env를 자동 주입한다 (`source .env` 불필요).
    // 쉘 환경변수보다 .env를 우선한다: Gradle 데몬은 자신을 처음 띄운 쉘의 환경을 계속
    // 들고 있어서, 쉘 우선으로 두면 오래된 값이 조용히 이기고 .env 수정이 안 먹는다.
    // 일회성 오버라이드가 필요하면 -Denv.KEY=VALUE 로 준다.
    readDotEnv(file('.env')).each { key, value ->
        environment(key, System.getProperty("env.$key") ?: value)
    }
}
