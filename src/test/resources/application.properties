# 테스트 전용 오버라이드. main 의 application.yml 은 그대로 로드되고, 여기 값이 우선한다.

# @SpringBootTest 컨텍스트마다 gRPC 서버가 9090 을 바인딩하려 해서 충돌한다.
# -1 은 net.devh 스타터에서 외부(netty) 서버를 띄우지 않는다는 뜻이다.
# gRPC 서비스 자체는 InternalUserGrpcServiceTest 가 in-process 서버로 직접 검증한다.
grpc.server.port=-1

# 컨텍스트마다 커넥션 풀이 따로 생긴다. transport 별 WebSocket 통합 테스트가 늘면서
# (stomp / websocket / both) 기본 풀 크기로는 Postgres 의 max_connections 를 넘겨
# "sorry, too many clients already" 로 컨텍스트 로딩이 실패했다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# 앱에 기본값이 없다(InternalTokenGuard 가 짧거나 빈 토큰이면 기동을 막는다).
# 테스트 컨텍스트도 실제 값이 있어야 뜨므로 여기서 고정한다 — 운영 값과 무관한 더미다.
internal.api-token=test-internal-token-0123456789abcdef

# application-secret.yml 은 gitignore 대상이라 CI에는 없다. application.yml의 JWT_SECRET
# 필수 placeholder를 테스트 전용 더미로 채워 컨텍스트가 개발자 로컬 시크릿에 의존하지 않게 한다.
jwt.secret=test-jwt-secret-0123456789abcdef0123456789abcdef

# ── OAuth ────────────────────────────────────────────────────────────────────
# 이 설정은 원래 application-secret.yml 에만 있었는데 그 파일은 .gitignore 대상이다.
# 그래서 OAuthControllerTest 가 "개발자 로컬 파일의 내용"에 따라 통과 여부가 갈렸고,
# 파일이 아예 없는 CI 러너에서는 provider 조회가 전부 실패해 FAIL/UNKNOWN 으로 떨어졌다.
#
# 테스트가 검증하는 것은 인가 URL 조립·state 더블서브밋·콜백 분기이지 실제 자격증명이
# 아니므로, 여기에 더미로 고정해 어디서 돌리든 같은 결과가 나오게 한다. 외부 HTTP 호출은
# 테스트가 RestTemplate 을 목킹해서 막는다.
#
# token-uri / user-info-uri 는 OAuthControllerTest 의 상수와 반드시 같아야 한다 —
# 목킹이 URI 로 매칭되기 때문에 다르면 스텁이 안 걸리고 null 이 돌아온다.
oauth.frontend-redirect-uri=http://localhost:5173/oauth/callback

oauth.provider.kakao.client-id=test-kakao-client-id
oauth.provider.kakao.client-secret=test-kakao-client-secret
oauth.provider.kakao.redirect-uri=http://localhost:8090/api/oauth/kakao/callback
oauth.provider.kakao.authorize-uri=https://kauth.kakao.com/oauth/authorize
oauth.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
oauth.provider.kakao.scope=profile_nickname,account_email

oauth.provider.google.client-id=test-google-client-id
oauth.provider.google.client-secret=test-google-client-secret
oauth.provider.google.redirect-uri=http://localhost:8090/api/oauth/google/callback
oauth.provider.google.authorize-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth.provider.google.token-uri=https://oauth2.googleapis.com/token
oauth.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
oauth.provider.google.scope=openid profile email

oauth.provider.naver.client-id=test-naver-client-id
oauth.provider.naver.client-secret=test-naver-client-secret
oauth.provider.naver.redirect-uri=http://localhost:8090/api/oauth/naver/callback
oauth.provider.naver.authorize-uri=https://nid.naver.com/oauth2.0/authorize
oauth.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
oauth.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
oauth.provider.naver.scope=name,email
