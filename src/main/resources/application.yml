spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-secret.yml

  main:
    web-application-type: servlet

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/planmate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtps.hiworks.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:planmate}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

internal:
  api-token: ${INTERNAL_API_TOKEN:local-internal-token}

# 내부 서비스 간 gRPC. HTTP 포트(server.port)와 별개이며 외부에 노출하지 않는다 —
# 컨테이너 간 통신만 하므로 nginx 라우팅 대상이 아니다.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    # 커뮤니티가 WatchUserChanges 스트림을 몇 시간씩 열어두고 keepalive 핑으로
    # 끊김을 감지한다. 기본 허용치(5분)는 클라이언트 핑 주기와 정확히 같아, 지터로
    # 조금만 일찍 도착해도 서버가 ENHANCE_YOUR_CALM GOAWAY 로 연결을 끊는다.
    # 여유를 명시해 keepalive 계약을 양쪽 기본값 일치에 기대지 않게 한다.
    permit-keep-alive-time: 1m

api:
  odsay:
    key: ${ODSAY_API_KEY:}
  tour:
    key: ${TOUR_API_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

sharedsync:
  websocket:
    endpoint: /ws
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    redis-sync:
      enabled: true
  auth:
    enabled: true
  presence:
    session-timeout: 3600
    cleanup-interval: 30
    broadcast-delay: 1000
  cache:
    type: redis

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.planmate: DEBUG

server:
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
