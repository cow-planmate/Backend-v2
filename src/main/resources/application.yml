spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-secret.yml

  main:
    web-application-type: servlet

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/planmate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: false

  mail:
    host: smtps.hiworks.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:}

internal:
  api-token: ${INTERNAL_API_TOKEN:local-internal-token}

api:
  odsay:
    key: ${ODSAY_API_KEY:}
  tour:
    key: ${TOUR_API_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

sharedsync:
  websocket:
    endpoint: /ws
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    redis-sync:
      enabled: true
  auth:
    enabled: true
  presence:
    session-timeout: 3600
    cleanup-interval: 30
    broadcast-delay: 1000
  cache:
    type: redis

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.planmate: DEBUG

server:
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
