spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-secret.yml

  main:
    web-application-type: servlet

  autoconfigure:
    # management.server.port 분리 시 자동으로 붙는 Basic Auth 비활성화 — 프로메테우스가
    # 인증 없이 스크랩하려면 필요하다. 대신 9091은 방화벽에서 오라클-arm IP만 허용해야 한다.
    exclude: org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/planmate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtps.hiworks.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        acks: all

  # @Scheduled 기본 스레드 풀은 1개다. 알림 outbox 발행기가 Kafka 응답을 건당 최대 10초씩
  # 동기 대기하므로(NotificationOutboxPublisher), 브로커가 죽으면 한 사이클이 그 스레드를
  # 수 분간 붙든다. 풀이 1이면 같은 스레드를 쓰는 SSE 하트비트(30초)까지 멈춰 리버스
  # 프록시가 멀쩡한 SSE 연결을 끊어버린다 — 브로커 장애가 알림 지연이 아니라 SSE 장애로
  # 번지는 경로다. 길게 블로킹하는 작업은 outbox 하나뿐이라, 나머지가 항상 돌 여유만 있으면 된다.
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

# 공공데이터(TourAPI) 캐시 DB — 읽기 전용 2번째 DataSource.
# spring.datasource(앱 DB, Flyway 관리)와 완전히 분리된 별도 인스턴스다.
# 스키마는 이 앱이 관리하지 않는다(pg_restore + 최신화 잡이 채운다 — project_ai/04_기능/ai/01_인프라설계.md).
# 로컬 기본값 = docker-compose.local.yml 의 tourdata-postgres(localhost:5433).
# 운영: 서버 .env 에 TOURDATA_DATASOURCE_* 주입 + compose environment 패스스루.
tourdata:
  datasource:
    url: ${TOURDATA_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tourdata}
    username: ${TOURDATA_DATASOURCE_USERNAME:postgres}
    password: ${TOURDATA_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

# planmate-ai (AI 챗봇 서버) — project_ai/04_기능/ai/06_챗봇_연동_설계.md §8.
# internal-token 은 planmate-ai .env 의 INTERNAL_SHARED_SECRET 과 같은 값이어야 한다.
# read-ms 40초 = Gemini 지연(2~20초) + planmate-ai 내부 데드라인(30초) 여유.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8010}
  internal-token: ${AI_INTERNAL_TOKEN:dev-secret}
  timeout:
    connect-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-ms: ${AI_READ_TIMEOUT_MS:40000}

notification:
  legacy-delivery:
    # Notification 서비스 컷오버 뒤에는 false. true인 동안은 Backend-v2가 협업 알림을
    # FCM/SSE로 직접 보내므로 Notification 전달과 동시에 켜면 사용자에게 두 번 간다.
    enabled: ${NOTIFICATION_LEGACY_DELIVERY_ENABLED:true}
  kafka:
    topic: ${NOTIFICATION_TOPIC:planmate.notification.requested.v1}
  outbox:
    poll-interval-ms: ${NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:500}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:planmate}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

internal:
  # 기본값을 두지 않는다. 이 토큰이 /api/internal/** 와 내부 gRPC 의 유일한 인증이라
  # 저장소에 적힌 기본값은 곧 공개된 비밀번호다. 미설정이면 InternalTokenGuard 가 기동을 막는다.
  api-token: ${INTERNAL_API_TOKEN:}
  outbox:
    # 소비자가 따라잡을 수 있는 최대 정지 시간이자, 탈퇴자의 옛 닉네임이 outbox에 남는 최대 기간.
    # 커서가 이 창 밖으로 밀려나면 서버가 전체 스냅샷으로 격하시켜 복구한다(유실 아님).
    retention-days: ${OUTBOX_RETENTION_DAYS:14}
    # 아래 둘의 곱이 소비자당 초당 전달 상한이다. 처리량이 늘면 코드 변경 없이 여기서 조절한다.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:500}

# 내부 서비스 간 gRPC. HTTP 포트(server.port)와 별개이며 외부에 노출하지 않는다 —
# 컨테이너 간 통신만 하므로 nginx 라우팅 대상이 아니다.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    # 커뮤니티가 WatchUserChanges 스트림을 몇 시간씩 열어두고 keepalive 핑으로
    # 끊김을 감지한다. 기본 허용치(5분)는 클라이언트 핑 주기와 정확히 같아, 지터로
    # 조금만 일찍 도착해도 서버가 ENHANCE_YOUR_CALM GOAWAY 로 연결을 끊는다.
    # 여유를 명시해 keepalive 계약을 양쪽 기본값 일치에 기대지 않게 한다.
    permit-keep-alive-time: 1m

api:
  odsay:
    key: ${ODSAY_API_KEY:}
  kakao:
    # 카카오 로컬(장소 검색) REST API 키. 지도 SDK의 JavaScript 키와 다른 키다.
    rest-key: ${KAKAO_REST_API_KEY:}
  google:
    key: ${GOOGLE_PLACES_API_KEY:}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

oauth:
  # 로컬은 application-secret.yml(gitignore)이 이 값들을 그대로 덮어쓴다 — import된 설정이 우선순위가 높다.
  # 운영은 application-secret.yml이 이미지에 포함되지 않으므로, 여기 환경변수가 유일한 공급처다.
  frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}
  provider:
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/oauth/kakao/callback}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      scope: profile_nickname,account_email
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}
      authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      scope: openid profile email
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:8080/api/oauth/naver/callback}
      authorize-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
      scope: name,email

jwt:
  # RS256 서명용 PKCS#8 개인키(PEM). 이 서비스만 갖는다 — 검증자들은 JWKS 로 공개키만 받는다.
  # 필수다. 없으면 JwtSigningKeys 가 기동을 막는다(예전에는 HS256 발급으로 조용히 떨어졌다).
  # 키 생성은 deploy/gen-jwt-key.sh 참고.
  private-key: ${JWT_PRIVATE_KEY:}
  # jwt.secret 은 2026-08-22 에 제거했다. 전환기에 옛 HS256 토큰을 검증하려고 남겼던
  # 값인데, 유예(refresh 7일)가 끝난 뒤에도 주입되고 있어서 그 값을 아는 누구나 토큰을
  # 위조할 수 있었다. 운영 .env 의 JWT_SECRET 도 함께 지울 것.
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

sharedsync:
  websocket:
    endpoint: /ws
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    # 전송 계층. stomp(현행) | both(전환기: STOMP 와 raw WS 동시) | websocket(전환 완료)
    #
    # 기본값을 stomp 로 두는 이유: 새 SharedSync 를 올리는 것 자체가 STOMP 경로의 내부를 바꾸는
    # 일이라(빈 배선·채널화·reflections 제거), 전송 계층 변경과 겹치면 문제가 생겼을 때 원인
    # 범위를 나눌 수 없다. 배포 후 관찰이 끝나면 환경변수만 both 로 올린다 — 재빌드 없이 되돌아온다.
    #
    # both 로 켜면 raw WS 가 /ws/v2 로 함께 뜬다(SockJS 가 /ws/** 를 통째로 잡아 같은 경로는 못 쓴다).
    transport: ${SHAREDSYNC_TRANSPORT:both}
    redis-sync:
      enabled: true
  auth:
    enabled: true
  presence:
    session-timeout: 3600
    cleanup-interval: 30
    broadcast-delay: 1000
  cache:
    type: redis

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.planmate: DEBUG

server:
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

management:
  # 별도 포트로 분리 — server.port(8080)의 SecurityFilterChain(JWT 인증)이 적용되지 않는
  # 독립 서블릿 컨테이너가 뜬다. 8080은 인터넷에 노출되므로 여기 프로메테우스 포트는
  # 호스트 방화벽에서 오라클-arm IP만 허용하도록 별도로 막아야 한다.
  # 주의: 포트를 분리하면 Spring Boot가 이 컨텍스트에 자체 Basic Auth를 자동으로 씌운다
  # (ManagementWebSecurityAutoConfiguration). 아래 spring.autoconfigure.exclude로 꺼야
  # 프로메테우스가 인증 없이 스크랩할 수 있다.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: planmate-backend-v2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
